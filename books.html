<!DOCTYPE html>
<html lang="zh-CN" translate="no">
<head>
  <meta charset="UTF-8">
  <meta name="google" content="notranslate">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Books — 九地 / JIUDI</title>
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <link href="https://cdn.jsdelivr.net/npm/@vp-tw/taipei-sans-tc@0.2.0/dist/Regular/TaipeiSansTCBeta-Regular.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/@vp-tw/taipei-sans-tc@0.2.0/dist/Bold/TaipeiSansTCBeta-Bold.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/@vp-tw/taipei-sans-tc@0.2.0/dist/Light/TaipeiSansTCBeta-Light.css" rel="stylesheet" media="print" onload="this.media='all'">
  <noscript><link href="https://cdn.jsdelivr.net/npm/@vp-tw/taipei-sans-tc@0.2.0/dist/Light/TaipeiSansTCBeta-Light.css" rel="stylesheet"></noscript>
  <style>
    :root {
      --paper: #F2F2EF;
      --ink: #151515;
      --ink-mute: rgba(21, 21, 21, 0.5);
      --thumb-w: clamp(430px, calc(91.8px + 28vw), 495px);
      --thumb-gap: 144px;
      --zh: "Helvetica Neue", Helvetica, Arial, "Taipei Sans TC", sans-serif;
      --zh-serif: "Helvetica Neue", Helvetica, Arial, "Taipei Sans TC", sans-serif;
      --en: "Helvetica Neue", Helvetica, Arial, "Taipei Sans TC", sans-serif;
      --en-serif: "Helvetica Neue", Helvetica, Arial, "Taipei Sans TC", sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: var(--paper);
      color: var(--ink);
      font-family: var(--en-serif);
      font-weight: 400;
      -webkit-font-smoothing: antialiased;
    }

    a,
    button {
      color: inherit;
      font: inherit;
      background: none;
      border: 0;
      padding: 0;
      text-decoration: none;
      cursor: pointer;
    }

    .page {
      position: fixed;
      inset: 0;
      background: var(--paper);
    }

    .identity {
      position: fixed;
      top: calc(28px - 0.25em);
      left: 36px;
      z-index: 20;
      display: inline-flex;
      flex-direction: row;
      flex-wrap: nowrap;
      align-items: baseline;
      column-gap: calc(0.28em - 3px);
      width: max-content;
      white-space: nowrap;
      font-size: 28px;
      line-height: 1;
    }

    .identity:hover {
      opacity: 0.7;
    }

    .identity .en,
    .identity .slash {
      font-family: "Helvetica Neue", Helvetica, Arial, "Taipei Sans TC", sans-serif;
      font-weight: 400;
      letter-spacing: 0;
      line-height: 1;
    }

    .identity .en {
      font-size: 24px;
      font-weight: 500;
    }

    .identity .slash {
      font-size: 24px;
      font-weight: 500;
    }

    .identity .zh {
      font-family: var(--zh-serif);
      font-size: 21px;
      font-weight: 600;
      letter-spacing: 2px;
      margin-right: -2px;
      line-height: 1;
    }

    .nav-block {
      position: fixed;
      top: 28px;
      right: 36px;
      z-index: 20;
      display: flex;
      flex-direction: column;
      align-items: flex-end;
    }

    .nav-toggle {
      width: 28px;
      height: 18px;
      position: relative;
    }

    .icon-burger,
    .icon-close {
      position: absolute;
      inset: 0;
    }

    .icon-burger {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .icon-burger span {
      display: block;
      width: 28px;
      height: 2px;
      background: var(--ink);
    }

    .icon-close {
      width: 12px;
      height: 12px;
      top: 3px;
      right: 0;
      left: auto;
      opacity: 0;
    }

    .icon-close span {
      position: absolute;
      left: 0;
      top: 50%;
      width: 12px;
      height: 1px;
      background: var(--ink);
    }

    .icon-close span:first-child {
      transform: rotate(45deg);
    }

    .icon-close span:last-child {
      transform: rotate(-45deg);
    }

    .nav-block.is-open .icon-burger {
      opacity: 0;
    }

    .nav-block.is-open .icon-close {
      opacity: 1;
    }

    .menu-links {
      display: none;
      position: absolute;
      top: calc(22px * 1.1 + 6px + 12px * 1.1 - 19px * 1.1);
      right: 0;
      margin-top: 0;
      flex-direction: row;
      align-items: flex-end;
      text-align: right;
      font-family: var(--en-serif);
      font-size: 19px;
      line-height: 1.1;
      font-weight: 400;
      gap: 22px;
      white-space: nowrap;
    }

    .nav-block.is-open .menu-links {
      display: flex;
    }

    .menu-links a,
    .menu-links a.is-current {
      color: var(--ink);
      opacity: 1;
      font-weight: 400;
      box-shadow: 0 1px 0 0 rgba(21, 21, 21, 0);
      transition: box-shadow 0.35s ease;
    }

    .menu-links a:hover,
    .menu-links a:focus-visible,
    .menu-links a:active {
      opacity: 1;
      font-weight: 400;
      box-shadow: 0 1px 0 0 var(--ink);
    }

    .lang {
      position: fixed;
      left: 36px;
      bottom: 32px;
      z-index: 20;
      font-family: var(--en-serif);
      font-size: 13px;
      font-weight: 500;
      letter-spacing: 0.06em;
    }

    .lang button {
      opacity: 0.35;
    }

    .lang button.is-on {
      opacity: 0.9;
    }

    .lang .sep {
      opacity: 0.35;
      margin: 0 6px;
      pointer-events: none;
    }

    .credit {
      position: fixed;
      right: 36px;
      bottom: 32px;
      z-index: 20;
      font-family: var(--en-serif);
      font-size: 12px;
      font-weight: 400;
      letter-spacing: 0.04em;
      opacity: 0.45;
    }

    .track-window {
      position: absolute;
      left: 0;
      right: 0;
      top: 50%;
      transform: translateY(-50%);
      overflow-x: auto;
      overflow-y: hidden;
      scroll-behavior: auto;
      scrollbar-width: none;
      padding: 10px 0;
    }

    .track-window::-webkit-scrollbar {
      display: none;
    }

    .track {
      display: flex;
      flex-wrap: nowrap;
      align-items: flex-start;
      gap: var(--thumb-gap);
      width: max-content;
      padding-left: 6vw;
      padding-right: 6vw;
    }

    .book {
      flex: 0 0 var(--thumb-w);
      width: var(--thumb-w);
      display: block;
    }

    .book.is-static {
      cursor: default;
    }

    .frame {
      display: block;
      width: 100%;
      aspect-ratio: 1 / 1;
      overflow: visible;
      background: none;
      border: none;
      outline: none;
    }

    .frame img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
      object-position: center;
      filter: drop-shadow(0 5px 8px rgba(0, 0, 0, 0.21));
      transform: scale(1);
      transform-origin: center center;
      transition: transform 0.35s ease;
    }

    .book:hover .frame img {
      transform: scale(1.08);
    }

    .book .title {
      display: block;
      margin-top: 15px;
      font-family: var(--en-serif);
      font-size: 19px;
      font-weight: 600;
      line-height: 1.3;
      text-align: center;
    }

    .book .year {
      display: block;
      margin-top: 2px;
      font-family: var(--en-serif);
      font-size: 15px;
      font-weight: 400;
      line-height: 1.2;
      text-align: center;
      opacity: 0.55;
    }

    html[lang="en"] .book .year {
      margin-top: 2px;
    }

    html[lang="zh-CN"] .book .title {
      font-family: var(--zh-serif);
      font-size: 18px;
      font-weight: 600;
    }

    @media (max-width: 899px) {
      .identity {
        top: calc(max(16px, env(safe-area-inset-top)) - 0.12em);
        left: max(16px, env(safe-area-inset-left));
      }

      .identity .en {
        font-size: 22px;
      }

      .identity .slash {
        font-size: 22px;
      }

      .identity .zh {
        font-size: 19px;
      }

      .nav-block {
        top: max(16px, env(safe-area-inset-top));
        right: max(16px, env(safe-area-inset-right));
        max-width: calc(100vw - 32px);
      }

      .icon-burger {
        inset: auto;
        top: 0;
        right: 0;
        width: 26px;
        height: 18px;
      }

      .icon-burger span {
        width: 26px;
      }

      .menu-links {
        position: absolute;
        top: calc(22px * 1.1 + 6px + 12px * 1.1 - 19px * 1.1);
        right: 0;
        margin-top: 0;
        flex-direction: row;
        align-items: flex-end;
        font-size: 17px;
        line-height: 1.1;
        font-weight: 400;
        gap: 14px;
        white-space: nowrap;
      }

      .menu-links a,
      .menu-links a.is-current {
        color: var(--ink);
        opacity: 1;
        font-weight: 400;
        box-shadow: 0 1px 0 0 rgba(21, 21, 21, 0);
        transition: box-shadow 0.35s ease;
      }

      .menu-links a:hover,
      .menu-links a:focus-visible,
      .menu-links a:active {
        opacity: 1;
        font-weight: 400;
        box-shadow: 0 1px 0 0 var(--ink);
      }

      .lang {
        left: max(16px, env(safe-area-inset-left));
        bottom: max(16px, env(safe-area-inset-bottom));
        font-size: 12px;
      }

      .credit {
        right: max(16px, env(safe-area-inset-right));
        bottom: max(16px, env(safe-area-inset-bottom));
        font-size: 11px;
      }

      .track-window {
        --cover: 79.2vw;
        left: 0;
        right: 0;
        top: 50%;
        transform: translateY(-50%);
        padding: 0;
        overflow-x: auto;
        overflow-y: hidden;
        scroll-snap-type: x mandatory;
        -webkit-overflow-scrolling: touch;
        overscroll-behavior-x: contain;
      }

      .track {
        gap: 18px;
        padding-left: calc((100vw - var(--cover)) / 2);
        padding-right: calc((100vw - var(--cover)) / 2);
      }

      .book {
        flex: 0 0 var(--cover);
        width: var(--cover);
        scroll-snap-align: center;
      }

      .book,
      .book:hover,
      .book:active,
      .book:focus {
        -webkit-tap-highlight-color: transparent;
        background: none;
        outline: none;
      }

      .book:focus-visible {
        outline: 1px dotted currentColor;
        outline-offset: 3px;
      }

      .book:hover .frame img {
        transform: none;
      }

      .book:active .frame img,
      .book.is-press .frame img {
        filter: grayscale(15%) drop-shadow(0 5px 8px rgba(0, 0, 0, 0.21));
      }

      .frame img {
        object-fit: contain;
      }

      .book .title,
      .book .year {
        width: 100%;
        margin-left: 0;
        margin-right: 0;
        padding-left: 0;
        padding-right: 0;
        box-sizing: border-box;
        text-align: center;
      }

      .book .title {
        margin-top: 10px;
        font-size: 16px;
        overflow-wrap: break-word;
      }

      html[lang="zh-CN"] .book .title {
        font-size: 15px;
      }

      .book .year {
        font-size: 12px;
      }

      html[lang="en"] .book .year {
        margin-top: 2px;
      }
    }
  </style>
</head>
<body>
  <div class="page">
    <a class="identity" href="index.html" translate="no">
      <span class="en">JIUDI</span><span class="slash">/</span><span class="zh">九地</span>
    </a>

    <div class="nav-block">
      <button class="nav-toggle" type="button" aria-expanded="false" aria-label="Menu">
        <span class="icon-burger">
          <span></span>
          <span></span>
          <span></span>
        </span>
        <span class="icon-close">
          <span></span>
          <span></span>
        </span>
      </button>
      <nav class="menu-links">
        <a href="works.html">Works</a>
        <a class="is-current" href="books.html">Books</a>
        <a href="about.html">About</a>
      </nav>
    </div>

    <div class="lang">
      <button type="button" data-lang="cn">CN</button><span class="sep">/</span><button type="button" data-lang="en">EN</button>
    </div>

    <div class="credit">© 2026 JIUDI</div>

    <div class="track-window">
      <div class="track"></div>
    </div>
  </div>

  <script>
    var LANG_KEY = "jiudi-lang";

    var BOOKS = [
      { slug: "golden-bridge", image: "images-web/books/golden-bridge.jpg", zh: "金桥", en: "Golden Bridge", year: "2024", href: "books/golden-bridge.html" }
    ];

    var track = document.querySelector(".track");
    var trackWindow = document.querySelector(".track-window");
    var navBlock = document.querySelector(".nav-block");
    var navToggle = document.querySelector(".nav-toggle");
    var langButtons = Array.prototype.slice.call(document.querySelectorAll(".lang button"));

    function currentLang() {
      return localStorage.getItem(LANG_KEY) === "en" ? "en" : "cn";
    }

    function applyLang(lang) {
      localStorage.setItem(LANG_KEY, lang);
      document.documentElement.lang = lang === "en" ? "en" : "zh-CN";

      langButtons.forEach(function (button) {
        button.classList.toggle("is-on", button.getAttribute("data-lang") === lang);
      });

      Array.prototype.forEach.call(document.querySelectorAll(".book"), function (item, index) {
        var book = BOOKS[index];
        item.querySelector(".title").textContent = lang === "en" ? book.en : book.zh;
        item.querySelector("img").alt = lang === "en" ? book.en : book.zh;
      });
    }

    BOOKS.forEach(function (book) {
      var item = document.createElement("a");
      item.className = "book";
      item.dataset.slug = book.slug;
      item.innerHTML = '<span class="frame"><img alt="" loading="lazy" decoding="async"></span><span class="title"></span>';
      item.querySelector("img").src = book.image;
      if (book.year) {
        var year = document.createElement("span");
        year.className = "year";
        year.textContent = book.year;
        item.appendChild(year);
      }
      if (book.href) {
        item.href = book.href;
      } else {
        item.href = "#";
        item.classList.add("is-static");
        item.addEventListener("click", function (event) {
          event.preventDefault();
        });
      }
      track.appendChild(item);
    });

    applyLang(currentLang());

    langButtons.forEach(function (button) {
      button.addEventListener("click", function () {
        applyLang(button.getAttribute("data-lang"));
      });
    });

    navToggle.addEventListener("click", function () {
      var open = !navBlock.classList.contains("is-open");
      navBlock.classList.toggle("is-open", open);
      navToggle.setAttribute("aria-expanded", open ? "true" : "false");
    });

    Array.prototype.forEach.call(document.querySelectorAll(".menu-links a"), function (link) {
      if (link.getAttribute("href") === "#") {
        link.addEventListener("click", function (event) {
          event.preventDefault();
        });
      }
    });

    (function bindCoverPress() {
      var startX = 0;
      var startY = 0;

      function pressedCover(event) {
        var frame = event.target.closest(".book .frame");
        return frame ? frame.closest(".book") : null;
      }

      function clearPress() {
        Array.prototype.forEach.call(document.querySelectorAll(".book.is-press"), function (cover) {
          cover.classList.remove("is-press");
        });
      }

      track.addEventListener("touchstart", function (event) {
        if (!window.matchMedia("(max-width: 899px)").matches || event.touches.length !== 1) {
          return;
        }
        var cover = pressedCover(event);
        if (!cover) {
          return;
        }
        startX = event.touches[0].clientX;
        startY = event.touches[0].clientY;
        cover.classList.add("is-press");
      }, { passive: true });

      track.addEventListener("touchmove", function (event) {
        if (event.touches.length !== 1) {
          return;
        }
        var cover = event.target.closest(".book");
        if (!cover || !cover.classList.contains("is-press")) {
          return;
        }
        var dx = event.touches[0].clientX - startX;
        var dy = event.touches[0].clientY - startY;
        if (Math.abs(dx) > 8 || Math.abs(dy) > 8) {
          cover.classList.remove("is-press");
        }
      }, { passive: true });

      track.addEventListener("touchend", clearPress, { passive: true });
      track.addEventListener("touchcancel", clearPress, { passive: true });
    })();

    trackWindow.addEventListener("wheel", function (event) {
      if (event.deltaY !== 0 && Math.abs(event.deltaY) > Math.abs(event.deltaX)) {
        trackWindow.scrollLeft += event.deltaY;
        event.preventDefault();
      }
    }, { passive: false });
  </script>
</body>
</html>
