<!DOCTYPE html>
<html lang="zh-CN" translate="no">
<head>
  <meta charset="UTF-8">
  <meta name="google" content="notranslate">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Works — 九地 / JIUDI</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=EB+Garamond:wght@400;500&family=Noto+Serif+SC:wght@400;500;600&family=STIX+Two+Text:wght@400&display=swap" rel="stylesheet">
  <style>
    :root {
      --paper: #F2F2EF;
      --ink: #151515;
      --ink-mute: rgba(21, 21, 21, 0.5);
      --thumb-w: clamp(430px, calc(91.8px + 28vw), 495px);
      --thumb-gap: 144px;
      --zh: "PingFang SC", "Hiragino Sans GB", "Noto Sans SC", "Microsoft YaHei", sans-serif;
      --zh-serif: "Source Han Serif CN", "Noto Serif SC", serif;
      --en: "Avenir Next", Avenir, "Helvetica Neue", Helvetica, Arial, sans-serif;
      --en-serif: "EB Garamond", Garamond, serif;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: var(--paper);
      color: var(--ink);
      font-family: var(--en-serif);
      font-weight: 400;
      -webkit-font-smoothing: antialiased;
    }

    a,
    button {
      color: inherit;
      font: inherit;
      background: none;
      border: 0;
      padding: 0;
      text-decoration: none;
      cursor: pointer;
    }

    .page {
      position: fixed;
      inset: 0;
      background: var(--paper);
    }

    .identity {
      position: fixed;
      top: calc(28px - 0.25em);
      left: 36px;
      z-index: 20;
      display: inline-flex;
      flex-direction: row;
      flex-wrap: nowrap;
      align-items: baseline;
      column-gap: calc(0.28em - 1px);
      width: max-content;
      white-space: nowrap;
      font-size: 28px;
      line-height: 1;
    }

    .identity:hover {
      opacity: 0.7;
    }

    .identity .en,
    .identity .slash {
      font-family: "STIX Two Text", "Times New Roman", serif;
      font-weight: 400;
      letter-spacing: 0;
      line-height: 1;
    }

    .identity .en {
      font-size: 27px;
    }

    .identity .slash {
      font-size: 24px;
    }

    .identity .zh {
      font-family: var(--zh-serif);
      font-size: 21px;
      font-weight: 600;
      letter-spacing: 2px;
      margin-right: -2px;
      line-height: 1;
    }

    .nav-block {
      position: fixed;
      top: 28px;
      right: 36px;
      z-index: 20;
      display: flex;
      flex-direction: column;
      align-items: flex-end;
    }

    .nav-toggle {
      width: 28px;
      height: 18px;
      position: relative;
    }

    .icon-burger,
    .icon-close {
      position: absolute;
      inset: 0;
    }

    .icon-burger {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .icon-burger span {
      display: block;
      width: 28px;
      height: 1px;
      background: var(--ink);
    }

    .icon-close {
      width: 12px;
      height: 12px;
      top: 3px;
      right: 0;
      left: auto;
      opacity: 0;
    }

    .icon-close span {
      position: absolute;
      left: 0;
      top: 50%;
      width: 12px;
      height: 1px;
      background: var(--ink);
    }

    .icon-close span:first-child {
      transform: rotate(45deg);
    }

    .icon-close span:last-child {
      transform: rotate(-45deg);
    }

    .nav-block.is-open .icon-burger {
      opacity: 0;
    }

    .nav-block.is-open .icon-close {
      opacity: 1;
    }

    .menu-links {
      display: none;
      position: absolute;
      top: calc(22px * 1.1 + 6px + 12px * 1.1 - 19px * 1.1);
      right: 0;
      margin-top: 0;
      flex-direction: row;
      align-items: flex-end;
      text-align: right;
      font-family: var(--en-serif);
      font-size: 19px;
      line-height: 1.1;
      font-weight: 400;
      gap: 22px;
      white-space: nowrap;
    }

    .nav-block.is-open .menu-links {
      display: flex;
    }

    .menu-links a,
    .menu-links a.is-current {
      color: var(--ink);
      opacity: 1;
      font-weight: 400;
      box-shadow: 0 1px 0 0 rgba(21, 21, 21, 0);
      transition: box-shadow 0.35s ease;
    }

    .menu-links a:hover,
    .menu-links a:focus-visible,
    .menu-links a:active {
      opacity: 1;
      font-weight: 400;
      box-shadow: 0 1px 0 0 var(--ink);
    }

    .lang {
      position: fixed;
      left: 36px;
      bottom: 32px;
      z-index: 20;
      font-family: var(--en-serif);
      font-size: 12px;
      font-weight: 500;
      letter-spacing: 0.06em;
    }

    .lang button {
      opacity: 0.35;
    }

    .lang button.is-on {
      opacity: 0.9;
    }

    .lang .sep {
      opacity: 0.35;
      margin: 0 6px;
      pointer-events: none;
    }

    .credit {
      position: fixed;
      right: 36px;
      bottom: 32px;
      z-index: 20;
      font-family: var(--en-serif);
      font-size: 11px;
      font-weight: 400;
      letter-spacing: 0.04em;
      opacity: 0.45;
    }

    .track-window {
      position: absolute;
      left: 0;
      right: 0;
      top: 50%;
      transform: translateY(-50%);
      overflow-x: auto;
      overflow-y: hidden;
      scroll-behavior: auto;
      scrollbar-width: none;
      padding: 10px 0;
    }

    .track-window::-webkit-scrollbar {
      display: none;
    }

    .track {
      display: flex;
      flex-wrap: nowrap;
      align-items: flex-start;
      gap: var(--thumb-gap);
      width: max-content;
      padding-left: 6vw;
      padding-right: 6vw;
    }

    .work {
      flex: 0 0 var(--thumb-w);
      width: var(--thumb-w);
      display: block;
    }

    .frame {
      display: block;
      width: 100%;
      aspect-ratio: 1 / 1;
      overflow: visible;
    }

    .frame img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
      transform: scale(1);
      transform-origin: center center;
      filter: grayscale(0);
      transition: transform 0.35s ease;
    }

    .work:hover .frame img {
      transform: scale(1.025);
    }

    .work .title {
      display: block;
      margin-top: 15px;
      font-family: var(--en-serif);
      font-size: 17px;
      font-weight: 500;
      line-height: 1.3;
      text-align: left;
    }

    .work .year {
      display: block;
      margin-top: 5px;
      font-family: var(--en-serif);
      font-size: 13px;
      font-weight: 400;
      line-height: 1.2;
      text-align: left;
      opacity: 0.55;
    }

    html[lang="en"] .work .year {
      margin-top: 2px;
    }

    html[lang="zh-CN"] .work .title {
      font-family: var(--zh-serif);
      font-size: 15px;
      font-weight: 500;
    }

    @media (max-width: 899px) {
      .identity {
        top: calc(max(16px, env(safe-area-inset-top)) - 0.12em);
        left: max(16px, env(safe-area-inset-left));
      }

      .identity .en {
        font-size: 25px;
      }

      .identity .slash {
        font-size: 22px;
      }

      .identity .zh {
        font-size: 19px;
      }

      .nav-block {
        top: max(16px, env(safe-area-inset-top));
        right: max(16px, env(safe-area-inset-right));
        max-width: calc(100vw - 32px);
      }

      .lang {
        left: max(16px, env(safe-area-inset-left));
        bottom: max(16px, env(safe-area-inset-bottom));
      }

      .credit {
        right: max(16px, env(safe-area-inset-right));
        bottom: max(16px, env(safe-area-inset-bottom));
      }

      .menu-links {
        position: absolute;
        top: calc(22px * 1.1 + 6px + 12px * 1.1 - 19px * 1.1);
        right: 0;
        margin-top: 0;
        flex-direction: row;
        align-items: flex-end;
        font-size: 19px;
        line-height: 1.1;
        font-weight: 400;
        gap: 14px;
        white-space: nowrap;
      }

      .menu-links a,
      .menu-links a.is-current {
        color: var(--ink);
        opacity: 1;
        font-weight: 400;
        box-shadow: 0 1px 0 0 rgba(21, 21, 21, 0);
        transition: box-shadow 0.35s ease;
      }

      .menu-links a:hover,
      .menu-links a:focus-visible,
      .menu-links a:active {
        opacity: 1;
        font-weight: 400;
        box-shadow: 0 1px 0 0 var(--ink);
      }

      .track-window {
        --cover: 79.2vw;
        left: 0;
        right: 0;
        top: 50%;
        transform: translateY(-50%);
        padding: 0;
        overflow-x: auto;
        overflow-y: hidden;
        scroll-snap-type: x mandatory;
        -webkit-overflow-scrolling: touch;
        overscroll-behavior-x: contain;
      }

      .track {
        gap: 18px;
        padding-left: calc((100vw - var(--cover)) / 2);
        padding-right: calc((100vw - var(--cover)) / 2);
      }

      .work {
        flex: 0 0 var(--cover);
        width: var(--cover);
        scroll-snap-align: center;
      }

      .work,
      .work:hover,
      .work:active,
      .work:focus {
        -webkit-tap-highlight-color: transparent;
        background: none;
        outline: none;
      }

      .work:focus-visible {
        outline: 1px dotted currentColor;
        outline-offset: 3px;
      }

      .work:hover .frame img {
        transform: none;
      }

      .work:active .frame img,
      .work.is-press .frame img {
        filter: grayscale(15%);
        -webkit-filter: grayscale(15%);
      }

      .work .title,
      .work .year {
        width: 100%;
        margin-left: 0;
        margin-right: 0;
        padding-left: 0;
        padding-right: 0;
        box-sizing: border-box;
        text-align: left;
      }

      .work .title {
        margin-top: 10px;
        font-size: 18px;
        overflow-wrap: break-word;
      }

      html[lang="zh-CN"] .work .title {
        font-size: 16px;
      }

      .work .year {
        font-size: 14px;
      }
    }
  </style>
</head>
<body>
  <div class="page">
    <a class="identity" href="index.html" translate="no">
      <span class="en">Jiudi</span><span class="slash">/</span><span class="zh">九地</span>
    </a>

    <div class="nav-block">
      <button class="nav-toggle" type="button" aria-expanded="false" aria-label="Menu">
        <span class="icon-burger">
          <span></span>
          <span></span>
          <span></span>
        </span>
        <span class="icon-close">
          <span></span>
          <span></span>
        </span>
      </button>
      <nav class="menu-links">
        <a class="is-current" href="works.html">Works</a>
        <a href="books.html">Books</a>
        <a href="about.html">About</a>
      </nav>
    </div>

    <div class="lang">
      <button type="button" data-lang="cn">CN</button><span class="sep">/</span><button type="button" data-lang="en">EN</button>
    </div>

    <div class="credit">© 2026 JIUDI</div>

    <div class="track-window">
      <div class="track"></div>
    </div>
  </div>

  <script>
    var LANG_KEY = "jiudi-lang";

    var PROJECTS = [
      { slug: "bouyei", image: "images/works/Bouyei.jpg", zh: "布依", en: "Bouyei", year: "2020–2024" },
      { slug: "golden-bridge", image: "images/works/golden-bridge.jpg", zh: "金桥", en: "Golden Bridge", year: "2016–2024" },
      { slug: "cronica", image: "images/works/cronica.jpg", zh: "一场事先张扬的凶杀案", en: "Crónica de una muerte anunciada", year: "2022" },
      { slug: "yoyo", image: "images/works/yoyo.jpg", zh: "幽幽", en: "YoYo", year: "2021" },
      { slug: "still-life", image: "images/works/Still Life.jpg", zh: "静物", en: "Still Life", year: "2025" },
      { slug: "beautiful-germs", image: "images/works/beautiful-germs.jpg", zh: "美丽的细菌", en: "The Beautiful Germs", year: "2014–2021" }
    ];

    var track = document.querySelector(".track");
    var trackWindow = document.querySelector(".track-window");
    var navBlock = document.querySelector(".nav-block");
    var navToggle = document.querySelector(".nav-toggle");
    var langButtons = Array.prototype.slice.call(document.querySelectorAll(".lang button"));

    function currentLang() {
      return localStorage.getItem(LANG_KEY) === "en" ? "en" : "cn";
    }

    function applyLang(lang) {
      localStorage.setItem(LANG_KEY, lang);
      document.documentElement.lang = lang === "en" ? "en" : "zh-CN";

      langButtons.forEach(function (button) {
        button.classList.toggle("is-on", button.getAttribute("data-lang") === lang);
      });

      Array.prototype.forEach.call(document.querySelectorAll(".work"), function (item, index) {
        var project = PROJECTS[index];
        item.querySelector(".title").textContent = lang === "en" ? project.en : project.zh;
        item.querySelector("img").alt = lang === "en" ? project.en : project.zh;
      });
    }

    PROJECTS.forEach(function (project) {
      var item = document.createElement("a");
      item.className = "work";
      item.href = "viewer.html?project=" + encodeURIComponent(project.slug);
      item.dataset.slug = project.slug;
      item.innerHTML = '<span class="frame"><img alt=""></span><span class="title"></span><span class="year"></span>';
      item.querySelector("img").src = encodeURI(project.image) + "?v=2";
      item.querySelector(".year").textContent = project.year;
      track.appendChild(item);
    });

    applyLang(currentLang());

    langButtons.forEach(function (button) {
      button.addEventListener("click", function () {
        applyLang(button.getAttribute("data-lang"));
      });
    });

    navToggle.addEventListener("click", function () {
      var open = !navBlock.classList.contains("is-open");
      navBlock.classList.toggle("is-open", open);
      navToggle.setAttribute("aria-expanded", open ? "true" : "false");
    });

    Array.prototype.forEach.call(document.querySelectorAll(".menu-links a"), function (link) {
      if (link.getAttribute("href") === "#") {
        link.addEventListener("click", function (event) {
          event.preventDefault();
        });
      }
    });

    (function bindCoverPress() {
      var startX = 0;
      var startY = 0;

      function pressedCover(event) {
        var touch = event.touches[0] || event.changedTouches[0];
        if (!touch) {
          return null;
        }
        var node = event.target;
        if (node && node.nodeType === 3) {
          node = node.parentElement;
        }
        var work = node && node.closest ? node.closest(".work") : null;
        if (!work) {
          var hit = document.elementFromPoint(touch.clientX, touch.clientY);
          work = hit && hit.closest ? hit.closest(".work") : null;
        }
        if (!work) {
          return null;
        }
        var frame = work.querySelector(".frame");
        if (!frame) {
          return null;
        }
        var box = frame.getBoundingClientRect();
        if (touch.clientX < box.left || touch.clientX > box.right || touch.clientY < box.top || touch.clientY > box.bottom) {
          return null;
        }
        return work;
      }

      function clearPress() {
        Array.prototype.forEach.call(document.querySelectorAll(".work.is-press"), function (cover) {
          cover.classList.remove("is-press");
        });
      }

      trackWindow.addEventListener("touchstart", function (event) {
        if (!window.matchMedia("(max-width: 899px)").matches || event.touches.length !== 1) {
          return;
        }
        var cover = pressedCover(event);
        if (!cover) {
          return;
        }
        startX = event.touches[0].clientX;
        startY = event.touches[0].clientY;
        cover.classList.add("is-press");
      }, { passive: true, capture: true });

      trackWindow.addEventListener("touchmove", function (event) {
        if (event.touches.length !== 1) {
          return;
        }
        var cover = event.target.closest ? event.target.closest(".work") : null;
        if (!cover || !cover.classList.contains("is-press")) {
          return;
        }
        var dx = event.touches[0].clientX - startX;
        var dy = event.touches[0].clientY - startY;
        if (Math.abs(dx) > 16 && Math.abs(dx) >= Math.abs(dy)) {
          cover.classList.remove("is-press");
        }
      }, { passive: true, capture: true });

      trackWindow.addEventListener("touchend", clearPress, { passive: true, capture: true });
      trackWindow.addEventListener("touchcancel", clearPress, { passive: true, capture: true });
    })();

    trackWindow.addEventListener("wheel", function (event) {
      if (event.deltaY !== 0 && Math.abs(event.deltaY) > Math.abs(event.deltaX)) {
        trackWindow.scrollLeft += event.deltaY;
        event.preventDefault();
      }
    }, { passive: false });
  </script>
</body>
</html>
