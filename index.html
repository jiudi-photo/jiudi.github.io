<!DOCTYPE html>
<html lang="zh-CN" translate="no">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>九地 / JIUDI</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=EB+Garamond:wght@400;500&family=Noto+Serif+SC:wght@400;500;600&family=STIX+Two+Text:wght@400&display=swap" rel="stylesheet">
  <style>
    :root {
      --fade: 0.8s;
      --text: rgba(255, 255, 255, 0.88);
      --text-strong: rgba(255, 255, 255, 0.98);
      --text-mute: rgba(255, 255, 255, 0.7);
      --shadow: 0 1px 10px rgba(0, 0, 0, 0.45);
      --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Noto Sans SC", "Microsoft YaHei", sans-serif;
      --zh-serif: "Source Han Serif CN", "Noto Serif SC", serif;
      --en: "Avenir Next", Avenir, "Helvetica Neue", Helvetica, Arial, sans-serif;
      --en-serif: "EB Garamond", Garamond, serif;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
      color: var(--text);
      font-family: var(--sans);
      font-weight: 400;
      -webkit-font-smoothing: antialiased;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    .stage {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: #000;
    }

    .slides,
    .slides img,
    .photo-hit {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
    }

    .slides img {
      object-fit: cover;
      object-position: center;
      opacity: 0;
      transition: opacity var(--fade) ease-in-out;
      pointer-events: none;
      display: block;
    }

    .slides img.is-on {
      opacity: 1;
    }

    .photo-hit {
      z-index: 1;
      padding: 0;
      border: 0;
      background: transparent;
      cursor: default;
    }

    .ui {
      pointer-events: none;
    }

    .identity,
    .nav-block,
    .social,
    .caption {
      position: absolute;
      z-index: 10;
      pointer-events: auto;
    }

    .identity {
      top: calc(28px - 0.25em);
      left: 36px;
      display: inline-flex;
      flex-direction: row;
      flex-wrap: nowrap;
      align-items: baseline;
      column-gap: calc(0.28em - 1px);
      width: max-content;
      white-space: nowrap;
      font-size: 28px;
      line-height: 1;
    }

    .identity:hover {
      opacity: 0.7;
    }

    .identity .en,
    .identity .slash {
      font-family: "STIX Two Text", "Times New Roman", serif;
      font-weight: 400;
      letter-spacing: 0;
      color: var(--text-strong);
      text-shadow: var(--shadow);
      line-height: 1;
    }

    .identity .en {
      font-size: 27px;
    }

    .identity .slash {
      font-size: 24px;
    }

    .identity .zh {
      font-family: var(--zh-serif);
      font-size: 21px;
      font-weight: 600;
      letter-spacing: 2px;
      margin-right: -2px;
      color: var(--text-strong);
      text-shadow: var(--shadow);
      line-height: 1;
    }

    .nav-block {
      position: fixed;
      top: 28px;
      right: 36px;
      z-index: 20;
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      filter: drop-shadow(0 1px 10px rgba(0, 0, 0, 0.45));
    }

    .nav-toggle {
      width: 28px;
      height: 18px;
      position: relative;
      color: inherit;
      font: inherit;
      background: none;
      border: 0;
      padding: 0;
      cursor: pointer;
    }

    .icon-burger,
    .icon-close {
      position: absolute;
      inset: 0;
    }

    .icon-burger {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .icon-burger span {
      display: block;
      width: 28px;
      height: 1px;
      background: #fff;
    }

    .icon-close {
      width: 12px;
      height: 12px;
      top: 3px;
      right: 0;
      left: auto;
      opacity: 0;
    }

    .icon-close span {
      position: absolute;
      left: 0;
      top: 50%;
      width: 12px;
      height: 1px;
      background: #fff;
    }

    .icon-close span:first-child {
      transform: rotate(45deg);
    }

    .icon-close span:last-child {
      transform: rotate(-45deg);
    }

    .nav-block.is-open .icon-burger {
      opacity: 0;
    }

    .nav-block.is-open .icon-close {
      opacity: 1;
    }

    .menu-links {
      display: none;
      margin-top: 16px;
      flex-direction: column;
      align-items: flex-end;
      text-align: right;
      font-family: var(--en-serif);
      font-size: 16px;
      line-height: calc(1.55em + 4px);
      font-weight: 500;
    }

    .nav-block.is-open .menu-links {
      display: flex;
    }

    .menu-links a {
      color: #fff;
      opacity: 0.5;
    }

    .menu-links a.is-current {
      opacity: 1;
      font-weight: 500;
    }

    .menu-links a:hover {
      opacity: 1;
    }

    .social {
      left: 36px;
      bottom: 32px;
      display: flex;
      flex-direction: column;
    }

    .social a {
      font-family: var(--en-serif);
      font-size: 13px;
      font-weight: 500;
      line-height: 1.6;
      color: var(--text-mute);
      text-shadow: var(--shadow);
    }

    .social a:hover {
      color: var(--text);
    }

    .caption {
      right: 36px;
      bottom: 32px;
      text-align: right;
      pointer-events: none;
      text-shadow: var(--shadow);
    }

    .caption .title {
      display: block;
      font-family: var(--zh-serif);
      font-size: 13px;
      font-weight: 400;
      line-height: 1.4;
    }

    .caption .year {
      display: block;
      margin-top: 4px;
      font-family: var(--en-serif);
      font-size: 12px;
      font-weight: 400;
      color: var(--text-mute);
    }

    .photo-dim {
      position: absolute;
      inset: 0;
      z-index: 2;
      pointer-events: none;
      opacity: 0;
    }

    @media (max-width: 899px) {
      html,
      body {
        height: 100%;
        height: 100dvh;
      }

      .stage {
        top: 0;
        left: 0;
        right: 0;
        bottom: auto;
        width: 100%;
        height: 100%;
        height: 100dvh;
      }

      .photo-dim {
        background: rgba(0, 0, 0, 0.2);
        transition: opacity 0.3s ease;
      }

      .stage.is-menu-open .photo-dim {
        opacity: 1;
      }

      .identity {
        top: calc(max(16px, env(safe-area-inset-top)) - 0.12em);
        left: max(16px, env(safe-area-inset-left));
      }

      .identity .en {
        font-size: 25px;
      }

      .identity .slash {
        font-size: 22px;
      }

      .identity .zh {
        font-size: 19px;
      }

      .nav-block {
        top: max(16px, env(safe-area-inset-top));
        right: max(16px, env(safe-area-inset-right));
        max-width: calc(100vw - 32px);
      }

      .menu-links {
        position: absolute;
        top: calc(22px * 1.1 + 6px + 12px * 1.1 - 19px * 1.1);
        right: 0;
        margin-top: 0;
        flex-direction: row;
        align-items: flex-end;
        font-size: 19px;
        line-height: 1.1;
        font-weight: 400;
        gap: 14px;
        white-space: nowrap;
      }

      .menu-links a,
      .menu-links a.is-current {
        color: var(--text-strong);
        opacity: 1;
        font-weight: 400;
        box-shadow: 0 1px 0 0 rgba(255, 255, 255, 0);
        transition: box-shadow 0.35s ease;
      }

      .menu-links a:hover,
      .menu-links a:focus-visible,
      .menu-links a:active {
        opacity: 1;
        font-weight: 400;
        box-shadow: 0 1px 0 0 #fff;
      }

      .social {
        left: max(16px, env(safe-area-inset-left));
        bottom: max(16px, env(safe-area-inset-bottom));
        max-width: 42%;
      }

      .caption {
        right: max(16px, env(safe-area-inset-right));
        bottom: max(16px, env(safe-area-inset-bottom));
        max-width: 48%;
        white-space: nowrap;
      }
    }
  </style>
</head>
<body>
  <div class="stage">
    <div class="slides" aria-hidden="true">
      <img class="layer is-on" src="images/home/home-01.jpg" alt="">
      <img class="layer" alt="">
    </div>

    <div class="photo-dim" aria-hidden="true"></div>

    <button class="photo-hit" type="button" aria-label="一场事先张扬的凶杀案"></button>

    <div class="ui">
      <a class="identity" href="./" translate="no">
        <span class="en">Jiudi</span><span class="slash">/</span><span class="zh">九地</span>
      </a>

      <div class="nav-block">
        <button class="nav-toggle" type="button" aria-expanded="false" aria-label="Menu">
          <span class="icon-burger">
            <span></span>
            <span></span>
            <span></span>
          </span>
          <span class="icon-close">
            <span></span>
            <span></span>
          </span>
        </button>
        <nav class="menu-links" translate="no">
          <a href="works.html">Works</a>
          <a href="books.html">Books</a>
          <a href="about.html">About</a>
        </nav>
      </div>

      <div class="social" translate="no">
        <a href="https://www.instagram.com/jiudix/" target="_blank" rel="noopener noreferrer">Instagram</a>
        <a href="https://www.xiaohongshu.com/user/profile/578329bd82ec3943a1e4ed5b" target="_blank" rel="noopener noreferrer">Xiaohongshu</a>
      </div>

      <div class="caption">
        <span class="title">一场事先张扬的凶杀案</span>
        <span class="year">2022</span>
      </div>
    </div>
  </div>

  <script>
    const HOLD_MS = 3500;
    const FADE_MS = 800;
    const MOBILE_MQ = "(max-width: 899px)";

    const WORKS = [
      { src: "images/home/home-01.jpg", title: "一场事先张扬的凶杀案", year: "2022", slug: "xiongsan" },
      { src: "images/home/home-02.jpg", title: "金桥", year: "2016–2024", slug: "jinqiao" },
      { src: "images/home/home-03.jpg", title: "金桥", year: "2016–2024", slug: "jinqiao" },
      { src: "images/home/home-04.jpg", title: "幽幽", year: "2021", slug: "youyou" },
      { src: "images/home/home-05.jpg", title: "金桥", year: "2016–2024", slug: "jinqiao" },
      { src: "images/home/home-06.jpg", title: "金桥", year: "2016–2024", slug: "jinqiao" },
      { src: "images/home/home-07.jpg", title: "幽幽", year: "2021", slug: "youyou" },
      { src: "images/home/home-08.jpg", title: "一场事先张扬的凶杀案", year: "2022", slug: "xiongsan" },
      { src: "images/home/home-09.jpg", title: "幽幽", year: "2021", slug: "youyou" },
      { src: "images/home/home-10.jpg", title: "金桥", year: "2016–2024", slug: "jinqiao" },
      { src: "images/home/home-11.jpg", title: "一场事先张扬的凶杀案", year: "2022", slug: "xiongsan" }
    ];

    const WORKS_MOBILE = [
      { src: "images/home-mobile/01.jpg", title: "一场事先张扬的凶杀案", year: "2022", slug: "cronica" },
      { src: "images/home-mobile/02.jpg", title: "金桥", year: "2016–2024", slug: "golden-bridge" },
      { src: "images/home-mobile/03.jpg", title: "幽幽", year: "2021", slug: "yoyo" },
      { src: "images/home-mobile/04.jpg", title: "静物", year: "2025", slug: "still-life" },
      { src: "images/home-mobile/05.jpg", title: "金桥", year: "2016–2024", slug: "golden-bridge" },
      { src: "images/home-mobile/06.jpg", title: "布依", year: "2020–2024", slug: "bouyei" },
      { src: "images/home-mobile/07.jpg", title: "金桥", year: "2016–2024", slug: "golden-bridge" },
      { src: "images/home-mobile/08.jpg", title: "金桥", year: "2016–2024", slug: "golden-bridge" },
      { src: "images/home-mobile/09.jpg", title: "美丽的细菌", year: "2014–2021", slug: "beautiful-germs" },
      { src: "images/home-mobile/10.jpg", title: "金桥", year: "2016–2024", slug: "golden-bridge" }
    ];

    const stage = document.querySelector(".stage");
    const layers = Array.from(document.querySelectorAll(".slides img"));
    const photoHit = document.querySelector(".photo-hit");
    const captionTitle = document.querySelector(".caption .title");
    const captionYear = document.querySelector(".caption .year");
    const navBlock = document.querySelector(".nav-block");
    const navToggle = document.querySelector(".nav-toggle");
    const mobileQuery = window.matchMedia(MOBILE_MQ);

    let currentIndex = 0;
    let front = 0;
    let busy = false;
    let pending = null;
    let playTimer = null;
    let usingMobile = mobileQuery.matches;

    function isMobile() {
      return mobileQuery.matches;
    }

    function currentSlides() {
      return isMobile() ? WORKS_MOBILE : WORKS;
    }

    function menuPaused() {
      return isMobile() && navBlock.classList.contains("is-open");
    }

    function preloadCurrent() {
      currentSlides().forEach(function (work) {
        const preload = new Image();
        preload.src = work.src;
      });
    }

    function updateCaption(work) {
      captionTitle.textContent = work.title;
      captionYear.textContent = work.year;
      photoHit.setAttribute("aria-label", work.title);
      photoHit.dataset.project = work.slug;
    }

    function scheduleNext() {
      clearTimeout(playTimer);
      if (menuPaused()) {
        return;
      }
      playTimer = setTimeout(function () {
        requestShow((currentIndex + 1) % currentSlides().length);
      }, HOLD_MS);
    }

    function requestShow(index) {
      if (index === currentIndex && !busy) {
        return;
      }

      clearTimeout(playTimer);

      if (busy) {
        pending = index;
        return;
      }

      crossfadeTo(index);
    }

    function crossfadeTo(index) {
      const work = currentSlides()[index];
      const incoming = layers[1 - front];

      busy = true;
      clearTimeout(playTimer);

      const reveal = function () {
        incoming.classList.add("is-on");
        layers[front].classList.remove("is-on");
        front = 1 - front;
        currentIndex = index;
        updateCaption(work);

        setTimeout(function () {
          busy = false;
          if (pending !== null && pending !== currentIndex) {
            const next = pending;
            pending = null;
            crossfadeTo(next);
            return;
          }
          pending = null;
          scheduleNext();
        }, FADE_MS);
      };

      if (incoming.getAttribute("src") === work.src && incoming.complete) {
        reveal();
        return;
      }

      incoming.onload = function () {
        incoming.onload = null;
        reveal();
      };

      incoming.src = work.src;

      if (incoming.complete) {
        incoming.onload = null;
        reveal();
      }
    }

    function resetSlideshow() {
      const list = currentSlides();
      currentIndex = 0;
      front = 0;
      busy = false;
      pending = null;
      clearTimeout(playTimer);
      layers[0].classList.add("is-on");
      layers[1].classList.remove("is-on");
      layers[0].src = list[0].src;
      layers[1].removeAttribute("src");
      updateCaption(list[0]);
      preloadCurrent();
      if (isMobile() && navBlock.classList.contains("is-open")) {
        stage.classList.add("is-menu-open");
      } else {
        stage.classList.remove("is-menu-open");
        scheduleNext();
      }
    }

    function onViewportChange() {
      var nowMobile = isMobile();
      if (nowMobile === usingMobile) {
        return;
      }
      usingMobile = nowMobile;
      resetSlideshow();
    }

    photoHit.addEventListener("click", function (event) {
      event.preventDefault();
      // Homepage V1: keep project slug on the hit target, do not navigate yet.
    });

    navToggle.addEventListener("click", function () {
      var open = !navBlock.classList.contains("is-open");
      navBlock.classList.toggle("is-open", open);
      navToggle.setAttribute("aria-expanded", open ? "true" : "false");
      if (isMobile()) {
        stage.classList.toggle("is-menu-open", open);
        if (open) {
          clearTimeout(playTimer);
        } else {
          scheduleNext();
        }
      }
    });

    Array.prototype.forEach.call(document.querySelectorAll(".menu-links a"), function (link) {
      if (link.getAttribute("href") === "#") {
        link.addEventListener("click", function (event) {
          event.preventDefault();
        });
      }
    });

    if (mobileQuery.addEventListener) {
      mobileQuery.addEventListener("change", onViewportChange);
    } else if (mobileQuery.addListener) {
      mobileQuery.addListener(onViewportChange);
    }

    layers[0].src = currentSlides()[0].src;
    updateCaption(currentSlides()[0]);
    preloadCurrent();
    scheduleNext();
  </script>
</body>
</html>
