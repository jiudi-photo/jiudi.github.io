<!DOCTYPE html>
<html lang="zh-CN" translate="no">
<head>
  <meta charset="UTF-8">
  <meta name="google" content="notranslate">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <link href="https://cdn.jsdelivr.net/npm/@vp-tw/taipei-sans-tc@0.2.0/dist/Regular/TaipeiSansTCBeta-Regular.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/@vp-tw/taipei-sans-tc@0.2.0/dist/Bold/TaipeiSansTCBeta-Bold.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/@vp-tw/taipei-sans-tc@0.2.0/dist/Light/TaipeiSansTCBeta-Light.css" rel="stylesheet" media="print" onload="this.media='all'">
  <noscript><link href="https://cdn.jsdelivr.net/npm/@vp-tw/taipei-sans-tc@0.2.0/dist/Light/TaipeiSansTCBeta-Light.css" rel="stylesheet"></noscript>
  <title>静物 — 九地 / JIUDI</title>
  <style>
    :root {
      --paper: #F2F2EF;
      --paper-sheet: #F8F8F5;
      --ink: #151515;
      --ink-mute: rgba(21, 21, 21, 0.5);
      --zh: "Helvetica Neue", Helvetica, Arial, "Taipei Sans TC", sans-serif;
      --zh-serif: "Helvetica Neue", Helvetica, Arial, "Taipei Sans TC", sans-serif;
      --en: "Helvetica Neue", Helvetica, Arial, "Taipei Sans TC", sans-serif;
      --en-serif: "Helvetica Neue", Helvetica, Arial, "Taipei Sans TC", sans-serif;
      --cols: 4;
      --gap-x: 14px;
      --gap-y: 18px;
      --safe-bottom: 10vh;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: var(--paper);
      color: var(--ink);
      font-family: var(--en-serif);
      font-weight: 400;
      -webkit-font-smoothing: antialiased;
    }

    a,
    button {
      color: inherit;
      font: inherit;
      background: none;
      border: 0;
      padding: 0;
      text-decoration: none;
      cursor: pointer;
    }

    .back {
      position: fixed;
      top: 28px;
      left: 36px;
      z-index: 20;
      font-family: var(--en-serif);
      font-size: 14px;
      font-weight: 500;
      letter-spacing: 0.04em;
      opacity: 0.82;
    }

    .back-mark {
      font-weight: 600;
    }

    .back:hover {
      opacity: 1;
    }

    .lang {
      position: fixed;
      left: 36px;
      bottom: 32px;
      z-index: 20;
      font-family: var(--en-serif);
      font-size: 13px;
      font-weight: 500;
      letter-spacing: 0.06em;
    }

    .lang button {
      opacity: 0.35;
    }

    .lang button.is-on {
      opacity: 0.9;
    }

    .lang .sep {
      opacity: 0.35;
      margin: 0 6px;
      pointer-events: none;
    }

    .scroll {
      position: absolute;
      top: 100px;
      left: 0;
      right: 0;
      bottom: var(--safe-bottom);
      overflow-x: hidden;
      overflow-y: auto;
      scroll-behavior: auto;
    }

    .layout {
      display: flex;
      align-items: flex-start;
      gap: 5vw;
      padding: 0 36px 28px 36px;
    }

    .meta {
      position: sticky;
      top: 0;
      flex: 0 0 12vw;
      min-width: 140px;
    }

    .meta .title {
      margin: 0;
      font-size: 23px;
      font-weight: 600;
      line-height: 1.3;
      font-family: var(--en-serif);
    }

    html[lang="zh-CN"] .meta .title {
      font-family: var(--zh-serif);
      font-size: 22px;
      font-weight: 600;
    }

    html[lang="en"] .meta .title {
      font-family: var(--en-serif);
      font-size: 23px;
      font-weight: 600;
    }

    .meta .year {
      display: block;
      margin-top: 2px;
      font-family: var(--en-serif);
      font-size: 16px;
      font-weight: 400;
      opacity: 0.55;
    }

    .meta .info-btn {
      display: block;
      margin-top: 8px;
      font-family: var(--en-serif);
      font-size: 17px;
      font-weight: 500;
      opacity: 0.7;
    }

    html[lang="zh-CN"] .meta .info-btn {
      font-family: var(--zh-serif);
      font-size: 17px;
      font-weight: 500;
    }

    .meta .info-btn:hover {
      opacity: 1;
    }

    .mode-switch {
      margin-top: 44px;
      font-family: var(--en-serif);
      font-size: 15px;
      letter-spacing: 0.04em;
    }

    .mode-switch a {
      font-weight: 400;
      opacity: 0.38;
      text-decoration: none;
      transition: opacity 180ms ease;
    }

    .mode-switch a + a {
      margin-left: 1.15em;
    }

    .mode-switch a.is-on {
      font-weight: 500;
      opacity: 0.92;
    }

    .mode-switch a:hover {
      opacity: 1;
    }

    .gallery {
      display: flex;
      flex-wrap: wrap;
      align-items: flex-start;
      column-gap: var(--gap-x);
      row-gap: var(--gap-y);
      max-width: 84vw;
      flex: 1 1 auto;
    }

    .cell {
      container-type: size;
      flex: 0 0 auto;
      width: calc((100% - (var(--cols) - 1) * var(--gap-x)) / var(--cols));
      aspect-ratio: 1 / 1;
      display: flex;
      align-items: center;
      justify-content: center;
      background: none;
      border: none;
      outline: none;
    }

    .shot {
      position: relative;
      display: block;
      line-height: 0;
      cursor: pointer;
    }

    .shot img {
      display: block;
      width: auto;
      height: auto;
      max-width: 100cqw;
      max-height: 100cqh;
      object-fit: contain;
      object-position: center;
      filter: brightness(1) contrast(1) saturate(1);
      transition: filter 0.25s ease;
    }

    .shot::after {
      content: "";
      position: absolute;
      inset: 0;
      background: rgba(242, 242, 239, 0.16);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease;
    }

    .shot:hover img {
      filter: brightness(1.06) contrast(0.94) saturate(0.92);
    }

    .shot:hover::after {
      opacity: 1;
    }

    .info-panel {
      position: fixed;
      left: 50%;
      top: 50%;
      z-index: 30;
      width: min(430px, calc(100vw - 48px));
      max-height: 65vh;
      overflow: auto;
      transform: translate(-50%, -50%);
      background: var(--paper-sheet);
      padding: 40px;
      box-shadow: 0 1px 0 rgba(21, 21, 21, 0.06);
      visibility: hidden;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.18s ease, visibility 0.18s ease;
    }

    .info-panel.is-open {
      visibility: visible;
      opacity: 1;
      pointer-events: auto;
    }

    .info-close {
      position: absolute;
      top: 16px;
      right: 16px;
      width: 13px;
      height: 13px;
      opacity: 0.2;
    }

    .info-close:hover {
      opacity: 0.5;
    }

    .info-close span {
      position: absolute;
      left: 0;
      top: 50%;
      width: 13px;
      height: 1px;
      background: var(--ink);
    }

    .info-close span:first-child {
      transform: rotate(45deg);
    }

    .info-close span:last-child {
      transform: rotate(-45deg);
    }

    .info-body {
      font-family: var(--en-serif);
    }

    .info-body p {
      margin: 0 0 1.15em;
      font-size: 15px;
      line-height: 1.75;
      font-weight: 400;
      text-align: left;
    }

    html[lang="zh-CN"] .info-body {
      font-family: var(--zh-serif);
    }

    html[lang="zh-CN"] .info-body p {
      font-size: 13px;
      font-weight: 300;
      text-align: justify;
    }

    html[lang="en"] .info-body {
      font-family: var(--en-serif);
    }

    html[lang="en"] .info-body p {
      font-size: 15px;
      font-weight: 400;
    }

    .info-body p:last-child {
      margin-bottom: 0;
    }


    @media (min-width: 900px) {
      .scroll {
        top: 28px;
        bottom: 32px;
      }

      .layout {
        padding-bottom: 0;
      }

      .meta {
        top: 72px;
        margin-top: 72px;
      }

    }

    @media (max-width: 1279px) {
      :root {
        --cols: 3;
      }
    }

    @media (max-width: 1099px) {
      :root {
        --cols: 2;
      }
    }

    .counter {
      display: none;
    }

    @media (max-width: 899px) {
      :root {
        --cols: 2;
        --gap-x: 12px;
        --gap-y: 10px;
      }

      .back {
        top: max(16px, env(safe-area-inset-top));
        left: max(16px, env(safe-area-inset-left));
        font-size: 13px;
      }

      .lang {
        left: max(16px, env(safe-area-inset-left));
        bottom: max(16px, env(safe-area-inset-bottom));
        font-size: 12px;
      }

      .meta .title {
        font-size: 21px;
      }

      html[lang="zh-CN"] .meta .title {
        font-size: 20px;
      }

      html[lang="en"] .meta .title {
        font-size: 21px;
      }

      .meta .year {
        font-size: 14px;
      }

      .meta .info-btn,
      html[lang="zh-CN"] .meta .info-btn {
        font-size: 15px;
      }

      .mode-switch {
        font-size: 13px;
      }

      .counter {
        font-size: 13px;
      }

      .info-body p,
      html[lang="en"] .info-body p {
        font-size: 14px;
      }

      html[lang="zh-CN"] .info-body p {
        font-size: 12px;
      }

      .scroll {
        top: calc(40px + env(safe-area-inset-top));
        bottom: calc(44px + env(safe-area-inset-bottom));
      }

      .layout {
        flex-direction: column;
        gap: 24px;
        padding: 0 16px 20px;
      }

      .meta {
        position: relative;
        top: auto;
        width: 100%;
        min-width: 0;
        flex: none;
        margin-top: 12px;
        display: grid;
        grid-template-columns: auto auto auto 1fr auto;
        grid-template-rows: auto auto auto;
        align-items: start;
        column-gap: 1.15em;
        row-gap: 0;
      }

      .meta .title {
        grid-column: 1 / 5;
        grid-row: 1;
      }

      .meta .year {
        grid-column: 1 / 5;
        grid-row: 2;
      }

      .meta .info-btn {
        grid-column: 5;
        grid-row: 1 / span 2;
        margin-top: 0;
        justify-self: end;
        align-self: start;
      }

      .mode-switch {
        display: contents;
      }

      .mode-switch a {
        grid-row: 3;
        margin-top: 8px;
        margin-left: 0;
        white-space: nowrap;
        align-self: baseline;
      }

      .mode-switch a + a {
        margin-left: 0;
      }

      .mode-switch a:nth-child(1) {
        grid-column: 1;
      }

      .mode-switch a:nth-child(2) {
        grid-column: 2;
      }

      .counter {
        display: none;
      }

      .gallery {
        max-width: none;
        width: 100%;
      }
    }
  </style>
</head>
<body>
  <a class="back" href="../works.html" translate="no"><span class="back-mark">&lt;</span> Back</a>

  <div class="lang">
    <button type="button" data-lang="cn">CN</button><span class="sep">/</span><button type="button" data-lang="en">EN</button>
  </div>


  <div class="scroll">
    <div class="layout">
      <aside class="meta">
        <h1 class="title"></h1>
        <span class="year">2025</span>
        <button class="info-btn" type="button"></button>
        <div class="mode-switch">
          <a class="mode" href="../viewer.html?project=still-life">Gallery</a>
          <a class="mode is-on" href="#">Index</a>
        </div>
        <span class="counter">01 / 01</span>
      </aside>
      <div class="gallery"></div>
    </div>
  </div>

  <div class="info-panel">
    <button class="info-close" type="button" aria-label="Close">
      <span></span>
      <span></span>
    </button>
    <div class="info-body"></div>
  </div>

  <script>
    var LANG_KEY = "jiudi-lang";
    var IMAGE_DIR = "../images-web/works/still-life/";

    var INFO = {
      cn: [
        "这组作品用来记录我对静物的观看方式的探索，所用到媒介包含：相机、扫描仪、拼贴等。"
      ],
      en: [
        "This series documents my exploration of ways of seeing still life, using a range of media including photography, scanning, and collage."
      ]
    };

    var titleEl = document.querySelector(".meta .title");
    var infoBtn = document.querySelector(".info-btn");
    var gallery = document.querySelector(".gallery");
    var panel = document.querySelector(".info-panel");
    var infoBody = document.querySelector(".info-body");
    var infoClose = document.querySelector(".info-close");
    var langButtons = Array.prototype.slice.call(document.querySelectorAll(".lang button"));

    function currentLang() {
      return localStorage.getItem(LANG_KEY) === "en" ? "en" : "cn";
    }

    function renderInfo(lang) {
      var blocks = INFO[lang] || INFO.cn;
      infoBody.innerHTML = "";
      blocks.forEach(function (block) {
        var p = document.createElement("p");
        p.textContent = block;
        infoBody.appendChild(p);
      });
    }

    function applyLang(lang) {
      localStorage.setItem(LANG_KEY, lang);
      document.documentElement.lang = lang === "en" ? "en" : "zh-CN";
      document.title = (lang === "en" ? "Still Life" : "静物") + " — 九地 / JIUDI";
      titleEl.textContent = lang === "en" ? "Still Life" : "静物";
      infoBtn.textContent = lang === "en" ? "Info" : "简介";

      Array.prototype.forEach.call(document.querySelectorAll(".mode-switch a.is-on"), function (link) {
      link.addEventListener("click", function (event) {
        event.preventDefault();
      });
    });

    langButtons.forEach(function (button) {
        button.classList.toggle("is-on", button.getAttribute("data-lang") === lang);
      });

      renderInfo(lang);
    }

    var FILES = [
        "01.jpg",
        "02.jpg",
        "03.jpg",
        "04.jpg",
        "05.jpg",
        "06.jpg",
        "07.jpg",
        "08.jpg"
    ];


    function loadImages() {
      FILES.forEach(function (file) {
        var cell = document.createElement("div");
        var link = document.createElement("a");
        var img = document.createElement("img");
        cell.className = "cell";
        link.className = "shot";
        link.href = "../viewer.html?project=still-life&image=" + encodeURIComponent(file);
        img.src = IMAGE_DIR + file;
        img.alt = "";
        img.loading = "lazy";
        link.appendChild(img);
        cell.appendChild(link);
        gallery.appendChild(cell);
      });
    }

    function openInfo() {
      renderInfo(currentLang());
      panel.classList.add("is-open");
    }

    function closeInfo() {
      panel.classList.remove("is-open");
    }

    infoBtn.addEventListener("click", function (event) {
      event.stopPropagation();
      if (panel.classList.contains("is-open")) {
        closeInfo();
      } else {
        openInfo();
      }
    });

    infoClose.addEventListener("click", function (event) {
      event.stopPropagation();
      closeInfo();
    });

    panel.addEventListener("click", function (event) {
      event.stopPropagation();
    });

    document.addEventListener("click", function () {
      if (panel.classList.contains("is-open")) {
        closeInfo();
      }
    });

    langButtons.forEach(function (button) {
      button.addEventListener("click", function () {
        applyLang(button.getAttribute("data-lang"));
      });
    });

    applyLang(currentLang());
    loadImages();
    (function () {
      var el = document.querySelector(".counter");
      if (!el || typeof FILES === "undefined") {
        return;
      }
      var n = FILES.length || 1;
      el.textContent = "01 / " + (n < 10 ? "0" + n : String(n));
    })();
  </script>
</body>
</html>
