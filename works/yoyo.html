<!DOCTYPE html>
<html lang="zh-CN" translate="no">
<head>
  <meta charset="UTF-8">
  <meta name="google" content="notranslate">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=EB+Garamond:wght@400;500;600&family=Noto+Serif+SC:wght@300;400;500&display=swap" rel="stylesheet">
  <title>幽幽 — 九地 / JIUDI</title>
  <style>
    :root {
      --paper: #F2F2EF;
      --paper-sheet: #F8F8F5;
      --ink: #151515;
      --ink-mute: rgba(21, 21, 21, 0.5);
      --zh: "PingFang SC", "Hiragino Sans GB", "Noto Sans SC", "Microsoft YaHei", sans-serif;
      --zh-serif: "Source Han Serif CN", "Noto Serif SC", serif;
      --en: "Avenir Next", Avenir, "Helvetica Neue", Helvetica, Arial, sans-serif;
      --en-serif: "EB Garamond", Garamond, serif;
      --cols: 4;
      --gap-x: 14px;
      --gap-y: 18px;
      --safe-bottom: 10vh;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: var(--paper);
      color: var(--ink);
      font-family: var(--en-serif);
      font-weight: 400;
      -webkit-font-smoothing: antialiased;
    }

    a,
    button {
      color: inherit;
      font: inherit;
      background: none;
      border: 0;
      padding: 0;
      text-decoration: none;
      cursor: pointer;
    }

    .back {
      position: fixed;
      top: 28px;
      left: 36px;
      z-index: 20;
      font-family: var(--en-serif);
      font-size: 13px;
      font-weight: 500;
      letter-spacing: 0.04em;
      opacity: 0.82;
    }

    .back-mark {
      font-weight: 600;
    }

    .back:hover {
      opacity: 1;
    }

    .lang {
      position: fixed;
      left: 36px;
      bottom: 32px;
      z-index: 20;
      font-family: var(--en-serif);
      font-size: 12px;
      font-weight: 500;
      letter-spacing: 0.06em;
    }

    .lang button {
      opacity: 0.35;
    }

    .lang button.is-on {
      opacity: 0.9;
    }

    .lang .sep {
      opacity: 0.35;
      margin: 0 6px;
      pointer-events: none;
    }

    .scroll {
      position: absolute;
      top: 100px;
      left: 0;
      right: 0;
      bottom: var(--safe-bottom);
      overflow-x: hidden;
      overflow-y: auto;
      scroll-behavior: auto;
    }

    .layout {
      display: flex;
      align-items: flex-start;
      gap: 5vw;
      padding: 0 36px 28px 36px;
    }

    .meta {
      position: sticky;
      top: 0;
      flex: 0 0 12vw;
      min-width: 140px;
    }

    .meta .title {
      margin: 0;
      font-size: 22px;
      font-weight: 600;
      line-height: 1.3;
      font-family: var(--en-serif);
    }

    html[lang="zh-CN"] .meta .title {
      font-family: var(--zh-serif);
      font-size: 21px;
      font-weight: 500;
    }

    html[lang="en"] .meta .title {
      font-family: var(--en-serif);
      font-size: 22px;
      font-weight: 600;
    }

    .meta .year {
      display: block;
      margin-top: 2px;
      font-family: var(--en-serif);
      font-size: 15px;
      font-weight: 400;
      opacity: 0.55;
    }

    .meta .info-btn {
      display: block;
      margin-top: 8px;
      font-family: var(--en-serif);
      font-size: 16px;
      font-weight: 500;
      opacity: 0.7;
    }

    html[lang="zh-CN"] .meta .info-btn {
      font-family: var(--zh-serif);
      font-size: 16px;
      font-weight: 500;
    }

    .meta .info-btn:hover {
      opacity: 1;
    }

    .mode-switch {
      margin-top: 44px;
      font-family: var(--en-serif);
      font-size: 14px;
      letter-spacing: 0.04em;
    }

    .mode-switch a {
      font-weight: 400;
      opacity: 0.38;
      text-decoration: none;
      transition: opacity 180ms ease;
    }

    .mode-switch a + a {
      margin-left: 1.15em;
    }

    .mode-switch a.is-on {
      font-weight: 500;
      opacity: 0.92;
    }

    .mode-switch a:hover {
      opacity: 1;
    }

    .gallery {
      display: flex;
      flex-wrap: wrap;
      align-items: flex-start;
      column-gap: var(--gap-x);
      row-gap: var(--gap-y);
      max-width: 84vw;
      flex: 1 1 auto;
    }

    .cell {
      container-type: size;
      flex: 0 0 auto;
      width: calc((100% - (var(--cols) - 1) * var(--gap-x)) / var(--cols));
      aspect-ratio: 1 / 1;
      display: flex;
      align-items: center;
      justify-content: center;
      background: none;
      border: none;
      outline: none;
    }

    .shot {
      position: relative;
      display: block;
      line-height: 0;
      cursor: pointer;
    }

    .shot img {
      display: block;
      width: auto;
      height: auto;
      max-width: 100cqw;
      max-height: 100cqh;
      object-fit: contain;
      object-position: center;
      filter: brightness(1) contrast(1) saturate(1);
      transition: filter 0.25s ease;
    }

    .shot::after {
      content: "";
      position: absolute;
      inset: 0;
      background: rgba(242, 242, 239, 0.16);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease;
    }

    .shot:hover img {
      filter: brightness(1.06) contrast(0.94) saturate(0.92);
    }

    .shot:hover::after {
      opacity: 1;
    }

    .info-panel {
      position: fixed;
      left: 50%;
      top: 50%;
      z-index: 30;
      width: min(430px, calc(100vw - 48px));
      max-height: 65vh;
      overflow: auto;
      transform: translate(-50%, -50%);
      background: var(--paper-sheet);
      padding: 40px;
      box-shadow: 0 1px 0 rgba(21, 21, 21, 0.06);
      visibility: hidden;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.18s ease, visibility 0.18s ease;
    }

    .info-panel.is-open {
      visibility: visible;
      opacity: 1;
      pointer-events: auto;
    }

    .info-close {
      position: absolute;
      top: 16px;
      right: 16px;
      width: 13px;
      height: 13px;
      opacity: 0.2;
    }

    .info-close:hover {
      opacity: 0.5;
    }

    .info-close span {
      position: absolute;
      left: 0;
      top: 50%;
      width: 13px;
      height: 1px;
      background: var(--ink);
    }

    .info-close span:first-child {
      transform: rotate(45deg);
    }

    .info-close span:last-child {
      transform: rotate(-45deg);
    }

    .info-body {
      font-family: var(--en-serif);
    }

    .info-body p {
      margin: 0 0 1.15em;
      font-size: 15px;
      line-height: 1.75;
      font-weight: 400;
      text-align: left;
    }

    html[lang="zh-CN"] .info-body {
      font-family: var(--zh-serif);
    }

    html[lang="zh-CN"] .info-body p {
      font-size: 13px;
      font-weight: 300;
      text-align: justify;
    }

    html[lang="en"] .info-body {
      font-family: var(--en-serif);
    }

    html[lang="en"] .info-body p {
      font-size: 15px;
      font-weight: 400;
    }

    .info-body p:last-child {
      margin-bottom: 0;
    }


    @media (min-width: 900px) {
      .scroll {
        top: 28px;
        bottom: 32px;
      }

      .layout {
        padding-bottom: 0;
      }

      .meta {
        top: 72px;
        margin-top: 72px;
      }

    }

    @media (max-width: 1279px) {
      :root {
        --cols: 3;
      }
    }

    @media (max-width: 1099px) {
      :root {
        --cols: 2;
      }
    }

    @media (max-width: 899px) {
      :root {
        --cols: 1;
        --gap-x: 12px;
        --gap-y: 12px;
      }

      .layout {
        flex-direction: column;
        gap: 28px;
        padding: 0 36px 28px;
      }

      .meta {
        position: relative;
        top: auto;
        width: 100%;
        min-width: 0;
        flex: none;
        display: grid;
        grid-template-columns: 1fr auto;
        grid-template-rows: auto auto auto;
        align-items: start;
      }

      .meta .title {
        grid-column: 1;
        grid-row: 1;
      }

      .meta .year {
        grid-column: 1;
        grid-row: 2;
      }

      .meta .info-btn {
        grid-column: 2;
        grid-row: 1 / span 2;
        margin-top: 0;
        justify-self: end;
        align-self: start;
      }

      .mode-switch {
        grid-column: 1 / -1;
        grid-row: 3;
        margin-top: 18px;
      }

      .gallery {
        max-width: none;
        width: 100%;
      }

      .cell {
        width: 100%;
      }
    }
  </style>
</head>
<body>
  <a class="back" href="../works.html" translate="no"><span class="back-mark">&lt;</span> Back</a>

  <div class="lang">
    <button type="button" data-lang="cn">CN</button><span class="sep">/</span><button type="button" data-lang="en">EN</button>
  </div>


  <div class="scroll">
    <div class="layout">
      <aside class="meta">
        <h1 class="title"></h1>
        <span class="year">2021</span>
        <button class="info-btn" type="button"></button>
        <div class="mode-switch">
          <a class="mode" href="../viewer.html?project=yoyo">Gallery</a>
          <a class="mode is-on" href="#">Index</a>
        </div>
      </aside>
      <div class="gallery"></div>
    </div>
  </div>

  <div class="info-panel">
    <button class="info-close" type="button" aria-label="Close">
      <span></span>
      <span></span>
    </button>
    <div class="info-body"></div>
  </div>

  <script>
    var LANG_KEY = "jiudi-lang";
    var IMAGE_DIR = "../images/works/yoyo/";

    var INFO = {
      cn: [
        "一个夜晚，我坐在商场附近的咖啡厅，从窗户望出去，偌大的广告牌上印刷的美女和我的目光撞上了。那个瞬间，一种极为奇异的对视，使某种强烈的感受从我体内迸发。",
        "这些“美女”画像几乎存在于我们视野的每个角落，但通常被忽略。画像中的女性大部分是不知名的、佚名的。我们无法得知这个人是否确切存在过，她们如同一个巨大的地下群体。而如此现实的展示，反而凸显了她们的神秘与虚幻。在这个人物画像泛滥、任何事似乎都有溯源的时代，她们无处不在的脸庞和背后的未知始终萦绕在我的脑海，于是我开始确立这个项目，并进行了大量拍摄。",
        "在一次次邂逅、观察与捕捉中，我的相机与我自身仿佛也遭到了她们的审视。有时看见这些目光，我感到压力。在摄像头无处不在的空间里，人们知道自己随时可能成为被捕捉的影像；而当我通过相机猎取她们的画像时，观看者与被观看者的位置却发生了置换。她们的每一双眼睛都预示着即将走来、或已经从她们面前掠过的人。恒久不动的身影和凝视，无声地目击着现实的运动幻影。",
        "这些女性大多以姣好、自信的状态出现在印刷品中。她们经过涂抹，被展示、消费和想象，却几乎从不需要拥有确切的身份。我们不会，也无法追问她们究竟是谁，因为她们刚好不会说话，也因此成为一个个承载想象的寄主。尽管她们的画像被加冕、恶搞、损坏或遗弃，但奇怪的是，她们依旧保持着美丽的面容与微笑。",
        "因为存在于扁平的表面之中，我们很容易认为她们不够生动与深刻。但在持续的观看中，这种扁平反而为我制造了一种饥饿：人物在画像中登场，又从现实中退场，如果她们只以扁平的面貌和这个世界发生联系，是否等同于没有发生联系，甚至等同于并不存在？",
        "摄影没有替我回答这些问题。我只是将她们一个个收集起来，把每个“她”视为独立的个体，又最终以群像的方式重新观看她们。渐渐地，她们在我的眼中变得鲜活而饱满。我为自己的饥饿找到了一处收容所。",
        "最终，我将她们命名为：幽幽。",
        "叠词的姓名具有亲近之感，而回到“幽”字本身，这些如同幽灵一般的女性形象，都在幽暗处闪烁着幽幽的目光。幽幽是她们每一位，也是同一位。在一次次邂逅与寻找中，与她们的目光对视时，我感到过亲切，有时又竟是甜蜜，最后回到寻常的陌生中。"
      ],
      en: [
        "One evening, I was sitting in a café near a shopping mall. Looking out the window, my gaze suddenly met that of a beautiful woman printed on a huge billboard. In that moment, something about the strangeness of our eye contact released an intense feeling in me.",
        "Images of these “beautiful women” exist almost everywhere within our field of vision, yet they usually go unnoticed. Most of the women depicted are unknown, anonymous. We cannot know for certain whether the person we see ever truly existed. They seem to form an immense underground population: the more visibly they are displayed in the real world, the more mysterious and unreal they become. In an age saturated with human images, when almost everything seems traceable to a source, their ubiquitous faces and the unknown behind them lingered in my mind like a fog. I began this project and started photographing them extensively.",
        "Through repeated encounters, observations, and acts of capture, I began to feel as though both my camera and I were being watched by them. At times, their gazes placed me under a subtle pressure. In spaces where cameras are everywhere, we know that at any moment we may become an image ourselves. Yet as I used my camera to capture these women, the positions of viewer and viewed began to reverse. Every pair of eyes seemed to anticipate those approaching, or to follow those who had already passed before them. Their motionless figures and enduring gazes silently witnessed the moving phantoms of reality.",
        "Most of these women appear in print as beautiful and self-assured. Retouched, displayed, consumed, and imagined, they are rarely required to possess an identifiable self. We neither do nor can ask who they really are. Conveniently, they cannot speak, and so they become vessels for our projections. Whether their images are celebrated, mocked, damaged, or abandoned, something strange happens: they continue to retain their beautiful faces and smiles.",
        "Existing on flat surfaces, they can easily appear to lack depth or vitality. Yet through sustained looking, this very flatness began to produce a kind of hunger in me. These figures enter the image and then retreat from reality, leaving behind mysteries that cannot be verified. If their only contact with the world takes place through these flattened images, does that mean the encounter never truly happened? Does it mean that they do not exist?",
        "Photography offered me no answers. I simply began collecting them, regarding each “her” as an individual while eventually seeing them together as a collective portrait. Gradually, they became vivid and full in my eyes. I had found a shelter for my hunger.",
        "Eventually, I gave them a name: YoYo (幽幽).",
        "In Chinese, the repetition of a character in a name carries a sense of intimacy. The character you (幽), however, evokes something secluded, dim, hidden, even ghostly. Like apparitions, these women flicker in the shadows, their quiet gazes shimmering from the darkness. YoYo is each one of them, and she is all of them at once.",
        "Across these repeated encounters and searches, there were moments when meeting their eyes felt familiar, sometimes even sweet—before everything returned, finally, to ordinary estrangement."
      ]
    };

    var titleEl = document.querySelector(".meta .title");
    var infoBtn = document.querySelector(".info-btn");
    var gallery = document.querySelector(".gallery");
    var panel = document.querySelector(".info-panel");
    var infoBody = document.querySelector(".info-body");
    var infoClose = document.querySelector(".info-close");
    var langButtons = Array.prototype.slice.call(document.querySelectorAll(".lang button"));

    function currentLang() {
      return localStorage.getItem(LANG_KEY) === "en" ? "en" : "cn";
    }

    function renderInfo(lang) {
      var blocks = INFO[lang] || INFO.cn;
      infoBody.innerHTML = "";
      blocks.forEach(function (block) {
        var p = document.createElement("p");
        p.textContent = block;
        infoBody.appendChild(p);
      });
    }

    function applyLang(lang) {
      localStorage.setItem(LANG_KEY, lang);
      document.documentElement.lang = lang === "en" ? "en" : "zh-CN";
      document.title = (lang === "en" ? "YoYo" : "幽幽") + " — 九地 / JIUDI";
      titleEl.textContent = lang === "en" ? "YoYo" : "幽幽";
      infoBtn.textContent = lang === "en" ? "Info" : "简介";

      Array.prototype.forEach.call(document.querySelectorAll(".mode-switch a.is-on"), function (link) {
      link.addEventListener("click", function (event) {
        event.preventDefault();
      });
    });

    langButtons.forEach(function (button) {
        button.classList.toggle("is-on", button.getAttribute("data-lang") === lang);
      });

      renderInfo(lang);
    }

    var FILES = [
        "01.jpg",
        "02.jpg",
        "03.jpg",
        "04.jpg",
        "05.jpg",
        "06.jpg",
        "07.jpg",
        "08.jpg",
        "09.jpg",
        "10.jpg",
        "11.jpg",
        "12.jpg",
        "13.jpg",
        "14.jpg",
        "15.jpg",
        "16.jpg",
        "17.jpg",
        "18.jpg",
        "19.jpg",
        "20.jpg",
        "21.jpg",
        "22.jpg",
        "23.jpg",
        "24.jpg",
        "25.jpg",
        "26.jpg",
        "27.jpg",
        "28.jpg",
        "29.jpg",
        "30.jpg",
        "31.jpg",
        "32.jpg",
        "33.jpg",
        "34.jpg",
        "35.jpg",
        "36.jpg",
        "37.jpg",
        "38.jpg",
        "39.jpg",
        "40.jpg",
        "41.jpg",
        "42.jpg",
        "43.jpg",
        "44.jpg",
        "45.jpg",
        "46.jpg",
        "47.jpg"
    ];


    function loadImages() {
      FILES.forEach(function (file) {
        var cell = document.createElement("div");
        var link = document.createElement("a");
        var img = document.createElement("img");
        cell.className = "cell";
        link.className = "shot";
        link.href = "../viewer.html?project=yoyo&image=" + encodeURIComponent(file);
        img.src = IMAGE_DIR + file;
        img.alt = "";
        img.loading = "lazy";
        link.appendChild(img);
        cell.appendChild(link);
        gallery.appendChild(cell);
      });
    }

    function openInfo() {
      renderInfo(currentLang());
      panel.classList.add("is-open");
    }

    function closeInfo() {
      panel.classList.remove("is-open");
    }

    infoBtn.addEventListener("click", function (event) {
      event.stopPropagation();
      if (panel.classList.contains("is-open")) {
        closeInfo();
      } else {
        openInfo();
      }
    });

    infoClose.addEventListener("click", function (event) {
      event.stopPropagation();
      closeInfo();
    });

    panel.addEventListener("click", function (event) {
      event.stopPropagation();
    });

    document.addEventListener("click", function () {
      if (panel.classList.contains("is-open")) {
        closeInfo();
      }
    });

    langButtons.forEach(function (button) {
      button.addEventListener("click", function () {
        applyLang(button.getAttribute("data-lang"));
      });
    });

    applyLang(currentLang());
    loadImages();
  </script>
</body>
</html>
